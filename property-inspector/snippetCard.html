<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Snippet Card</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#1e1f22;color:#fff;font-family:Arial,sans-serif;font-size:13px}
    .wrap{padding:10px 12px;display:grid;grid-template-columns:90px minmax(0,1fr);gap:8px 10px;align-items:center;max-width:540px}
    .name{font-weight:900;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    button{border:0;border-radius:9px;background:#16ffe1;color:#061114;font-weight:900;padding:8px 10px;cursor:pointer;width:100%}
    .secondary{background:#2b3446;color:#fff}
    .status{grid-column:1 / -1;display:flex;justify-content:space-between;color:#9fa8bd;font-size:11px}
    .ok{color:#5cff9d}.warn{color:#ffd166}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="name">Snippet Card</div>
    <button id="openPanel" type="button">Abrir painel web</button>
    
    <div class="status"><span id="conn">iniciando</span><span id="state" class="warn">aguardando</span></div>
  </div>
  <script src="../libs/js/constants.js"></script>
  <script src="../libs/js/eventEmitter.js"></script>
  <script src="../libs/js/timers.js"></script>
  <script src="../libs/js/utils.js"></script>
  <script src="../libs/js/ulanziApi.js"></script>
  <script>
    const conn = document.querySelector('#conn');
    const state = document.querySelector('#state');
    $UD.connect('com.ulanzi.ulanzistudio.deckdeckdeco.snippetCard');
    $UD.onConnected(() => { conn.textContent='conectado'; state.textContent='pronto'; state.className='ok'; });
    document.querySelector('#openPanel').addEventListener('click', () => {
      if ($UD.sendToPlugin) $UD.sendToPlugin({ type:'openPanel' });
      state.textContent='abrindo'; state.className='ok';
    });
    const icons = document.querySelector('#openIcons');
    if (icons) icons.addEventListener('click', () => {
      if ($UD.sendToPlugin) $UD.sendToPlugin({ type:'openIconFolder' });
      state.textContent='abrindo icons'; state.className='ok';
    });
  </script>
</body>
</html>
